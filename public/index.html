<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <!-- Link to the compiled Tailwind CSS -->
  <link rel="stylesheet" href="/dist/styles.css">
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-100">

  <!-- Login Card -->
  <div class="w-full max-w-sm bg-white shadow-lg rounded-xl p-8">
    <!-- Title -->
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Login</h1>

    <!-- Form -->
    <form id="loginForm" class="space-y-4">
      <input 
        id="username" 
        type="text" 
        placeholder="Username" 
        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
      >
      <input 
        id="password" 
        type="password" 
        placeholder="Password" 
        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
      >

      <!-- Login Button -->
      <button 
        type="submit" 
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow">
        Login
      </button>
    </form>

    <!-- Register Section -->
    <p class="mt-4 text-center text-gray-600">
      Don’t have an account? 
      <a href="/register.html" class="text-blue-600 hover:underline">Register</a>
    </p>
  </div>

  <!-- JavaScript (same as your original) -->
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const userInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');

      const username = userInput.value.trim();
      const password = passwordInput.value.trim();
      
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ username, password }),
      });
      if (res.ok) {
        window.location.href = '/app.html';
      } else {
        alert('Invalid credentials');
      }
    });
  </script>
</body>
</html>
